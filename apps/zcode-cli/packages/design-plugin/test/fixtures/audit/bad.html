<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter">
<style>body{margin:0;font:16px/1.6 sans-serif;color:#111;background:#fff}main{padding:0 40px}
.tiny{font-size:10px}.faint{color:#aaa}.cut{width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tight{width:200px;line-height:1.05}.stack{position:relative;height:40px}.stack span{position:absolute;left:0;top:0}
.edge{margin-left:-36px}</style></head><body><main>
<p class="tiny">Caption at ten pixels</p>
<p class="faint">Light gray body copy on white</p>
<p class="cut">A long label that does not fit</p>
<p class="tight">Several lines of running text squeezed with almost no leading at all here</p>
<div class="stack"><span>Label one</span><span>Label two</span></div>
<p class="edge">Touches the edge</p>
<p class="eyebrow">Our Services</p><h2>Services</h2>
</main></body></html>
