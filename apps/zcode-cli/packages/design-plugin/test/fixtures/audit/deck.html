<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;color:#111;font:32px/1.5 sans-serif}
.slide{position:absolute;inset:0;padding:80px;opacity:0;transition:opacity .4s}.slide.active{opacity:1}
.small{font-size:9px}</style></head><body>
<section class="slide active"><h1>Opening slide</h1><aside class="notes">Open with the number, then pause.</aside></section>
<section class="slide"><h2>Second slide</h2></section>
<section class="slide"><h2>Third slide</h2><p class="small">Fine print far too small</p></section>
</body></html>
