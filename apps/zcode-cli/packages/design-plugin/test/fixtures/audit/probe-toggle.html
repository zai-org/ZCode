<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:16px/1.5 sans-serif;padding:24px}
.tg input{position:absolute;opacity:0}.tg span{display:inline-block;width:44px;height:24px;background:#ccc;border-radius:12px;position:relative}
.tg span::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff}.tg input:checked+span::after{left:22px}
#dead{padding:10px;font:inherit}#dead .ic{color:#333}#dead:focus .ic{color:#c00}</style></head><body>
<label class="tg" id="tg"><input type="checkbox"><span></span></label>
<p><button id="dead"><svg class="ic" width="16" height="16"><rect width="16" height="16" fill="currentColor"/></svg> Do</button></p></body></html>
