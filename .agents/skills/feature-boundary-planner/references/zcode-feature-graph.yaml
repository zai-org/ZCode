d message and closes exactly 2000ms after it appears. Install error diagnostics, rejects, and timeout write a UI warning log plus a localized warning toast, replace the old operationId, and restore the same PopoverContent to confirmation while keeping the plain prompt and dropping late results. Enable failure retains the same anchored error result behavior. Manual prompt takeover dismisses the old Plugin action Popover without a cancellation notice. Refresh/install/enable remain bound to one cancellable operationId at a time; API Key, OAuth, and user config are outside this flow."
