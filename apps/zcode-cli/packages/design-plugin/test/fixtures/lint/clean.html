<!doctype html>
<html lang="en" data-zcode-design>
<head>
<style>
  :root {
    --ink: #14213d;
    --paper: #FBF8F1;
    --accent: #e76f51;
    --line: rgba(20, 33, 61, 0.12);
    --font-display: "Fraunces", Georgia, serif;
  }
  /* a comment with #ff00ff must not count */
  body { margin: 0; padding: 16px 1.5rem; color: var(--ink); background: var(--paper); font-family: "Source Sans 3", "PingFang SC", sans-serif; }
  h1 { font: 700 2.5rem/1.1 var(--font-display); }
  #fab { gap: 8px; }
  @media (max-width: 600px) { body { padding: 4px; border-bottom: 1px solid rgb(231 111 81 / 40%); } }
</style>
</head>
<body>
  <h1 style="color: #14213d">Tide tables</h1>
  <button style="background: var(--accent); font-family: &quot;Fraunces&quot;, serif">Plan a crossing</button>
  <svg viewBox="0 0 10 10"><path d="M0 0h10" stroke="#e76f51"/></svg>
</body>
</html>
