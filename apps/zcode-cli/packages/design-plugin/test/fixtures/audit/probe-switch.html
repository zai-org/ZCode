<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:16px/1.5 sans-serif;padding:24px}.row{display:flex;justify-content:space-between;max-width:520px;padding:12px 0}
.sw{width:44px;height:24px;border-radius:12px;background:#9ca3af;border:0;position:relative}.sw[aria-checked=true]{background:#15803d}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff}.sw[aria-checked=true]::after{transform:translateX(20px)}</style></head><body>
<div class="row"><b>Mentions</b><button class="sw" id="sw" role="switch" aria-checked="false" aria-label="Mentions"></button></div>
<script>sw.onclick=()=>sw.setAttribute("aria-checked",sw.getAttribute("aria-checked")!=="true")</script></body></html>
