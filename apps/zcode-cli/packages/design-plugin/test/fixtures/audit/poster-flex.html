<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#ddd;display:flex;justify-content:center;padding:40px}
.poster{width:1080px;height:1350px;background:#0d1b2a;color:#fff;position:relative;overflow:hidden;font-family:Georgia,serif}
.poster h1{position:absolute;left:80px;top:120px;font-size:140px;line-height:.9;margin:0;width:900px}
