<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;font:16px/1.5 sans-serif;color:#111;padding:24px}.panel{display:block;padding:16px;background:#eef;margin-top:16px}
.panel[hidden]{display:none}#soft-panel{transition:opacity .2s ease-out}@starting-style{#soft-panel{opacity:0}}</style></head><body>
<button id="soft" onclick="document.getElementById('soft-panel').hidden=false">Open soft</button>
<button id="snap" onclick="document.getElementById('snap-panel').hidden=false">Open snap</button>
<div class="panel" id="soft-panel" hidden>Soft panel content</div><div class="panel" id="snap-panel" hidden>Snap panel content</div>
</body></html>
